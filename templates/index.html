<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Genomic Pipeline Dashboard</title>
    <!-- Tailwind CSS for Professional Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* CSS to style the Markdown generated by LangChain so it looks like a physical report */
        .clinical-report {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .clinical-report h1 { font-size: 1.75rem; font-weight: 700; color: #1e3a8a; margin-bottom: 1rem; border-bottom: 2px solid #e5e7eb; padding-bottom: 0.5rem; }
        .clinical-report h2 { font-size: 1.25rem; font-weight: 600; color: #374151; margin-top: 1.5rem; margin-bottom: 0.5rem; }
        .clinical-report p { margin-bottom: 1rem; color: #4b5563; line-height: 1.6; }
        .clinical-report strong { color: #111827; }
        .clinical-report hr { margin: 2rem 0; border-color: #d1d5db; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800">

    <!-- Navigation Bar -->
    <nav class="bg-blue-900 text-white shadow-md p-4">
        <div class="max-w-5xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold tracking-wider">🧬 OP-MIND: GENOMIC AI PIPELINE</h1>
            <span class="text-sm bg-blue-700 px-3 py-1 rounded-full border border-blue-500">Agentic RAG Active</span>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="max-w-5xl mx-auto mt-8 grid grid-cols-1 md:grid-cols-3 gap-8 px-4">
        
        <!-- Left Column: Input Form -->
        <div class="col-span-1 bg-white p-6 rounded-lg shadow-sm border border-gray-200 h-fit">
            <h2 class="text-lg font-semibold mb-4 text-gray-700">Sequence Input</h2>
            <form method="POST" action="/">
                <label class="block text-sm font-medium text-gray-600 mb-2">Patient DNA Sequence (60 chars)</label>
                <textarea 
                    name="dna_sequence" 
                    rows="5" 
                    class="w-full border border-gray-300 rounded-md p-3 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-blue-500 uppercase"
                    placeholder="Enter ATGC pattern..."
                    required>{{ dna_input }}</textarea>
                
                <button type="submit" class="mt-4 w-full bg-blue-600 text-white font-semibold py-2 rounded-md hover:bg-blue-700 transition duration-200">
                    Analyze Sequence
                </button>
            </form>
        </div>

        <!-- Right Column: Physical Report Output -->
        <div class="col-span-1 md:col-span-2">
            {% if report %}
                <!-- This white box mimics a piece of A4 paper -->
                <div class="bg-white p-10 rounded-lg shadow-lg border border-gray-300 clinical-report min-h-[500px]">
                    {{ report | safe }}
                </div>
            {% else %}
                <!-- Placeholder before submission -->
                <div class="bg-gray-50 p-10 rounded-lg border-2 border-dashed border-gray-300 flex items-center justify-center min-h-[500px] text-gray-400">
                    <p class="text-center">Submit a DNA sequence to generate a Clinical Genomics Report.</p>
                </div>
            {% endif %}
        </div>
    </div>

</body>
</html>
